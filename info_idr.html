<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="info_style.css">
    <script src="info_script.js"></script>
    <title>Dettagli idrante</title>
</head>

<body onload="start()">
    <nav id="navbar">
        <div id="navbar-left"><a href="./index.html">Idranti Sicuri VR</a></div>
        <div id="navbar-right"><a href="#">Segnala idrante</a></div>
    </nav>
    <div id="page_content">
        <h1>Dettagli idrante</h1>
        <form>
            <h3>Inserire ID idrante:</h3>
            <input id="IDidr_input" type="text" placeholder="ID idrante">
            <input onclick="confButtPressed()" type="button" value="Conferma">
        </form>

        <hr>

        <span id="error" style="display: none;">Immettere un ID valido</span>

        <table id="info_table" style="display: none;">
            <tr>
                <td class="keys">ID</td>
                <td class="vals" id="info_id"></td>
            </tr>
            <tr>
                <td class="keys">Latitudine</td>
                <td class="vals" id="info_lat"></td>
            </tr>
            <tr>
                <td class="keys">Longitudine</td>
                <td class="vals" id="info_lon"></td>
            </tr>
            <tr>
                <td class="keys">Immagini</td>
                <td class="vals" id="info_imgs" style="display: flex;"><img id="info_img1" style="height: 150px;"><img id="info_img2" style="height: 150px;"></td>
            </tr>
            <tr>
                <td class="keys">Operativo</td>
                <td class="vals" id="info_op"></td>
            </tr>
            <tr>
                <td class="keys">Campo 1</td>
                <td class="vals" id="info_c1"></td>
            </tr>
            <tr>
                <td class="keys">Campo 2</td>
                <td class="vals" id="info_c2"></td>
            </tr>
            <tr>
                <td class="keys">Campo 3</td>
                <td class="vals" id="info_c3"></td>
            </tr>
        </table>
    </div>


</body>

</html>
