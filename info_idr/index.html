<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../body_navbar.css">
    <script src="./script.js"></script>
    <title>Dettagli idrante</title>
</head>

<body onload="start()">
    <nav id="navbar">
        <div id="navbar-left"><a href="../index.html">Idranti Sicuri VR</a></div>
        <div id="navbar-right" class="button-with-hover"><a href="../add_idr/index.html"><button
                    class="btn-primary">Segnala idrante</button></a></div>
    </nav>
    <div id="page_content">
        <h1 style="text-align: center">Dettagli idrante</h1>
        <form id="insert_code">
            <h3 style="margin-bottom: 22px">Inserire ID idrante:</h3>
            <input id="IDidr_input" type="text" oninput="checkInpID()" placeholder="ID idrante">
            <input onclick="confButtPressed()" type="button" class="btn btn-primary" id="button_conf" value="Conferma">
        </form>

        <hr>

        <table id="info_table">
            <tr>
                <td class="keys">ID</td>
                <td class="vals" id="info_id"></td>
            </tr>
            <tr>
                <td class="keys">Latitudine</td>
                <td class="vals" id="info_lat"></td>
            </tr>
            <tr>
                <td class="keys">Longitudine</td>
                <td class="vals" id="info_lon"></td>
            </tr>
            <tr>
                <td class="keys">Immagini</td>
                <td class="vals" id="info_imgs">
                    <span id="info_img_error">Non è presente nessuna immagine</span>
                    <a id="info_img1_link"><img id="info_img1" style="height: 150px;"></a>
                    <a id="info_img2_link"><img id="info_img2" style="height: 150px;"></a>
                    <a id="info_img3_link"><img id="info_img3" style="height: 150px;"></a>
                </td>
            </tr>
            <tr>
                <td class="keys">Operativo</td>
                <td class="vals" id="info_op"></td>
            </tr>
            <tr>
                <td class="keys">Campo 1</td>
                <td class="vals" id="info_c1"></td>
            </tr>
            <tr>
                <td class="keys">Campo 2</td>
                <td class="vals" id="info_c2"></td>
            </tr>
            <tr>
                <td class="keys">Campo 3</td>
                <td class="vals" id="info_c3"></td>
            </tr>
        </table>
        <div id="actionBtn">
            <a id="editBtn_a" href="../edit_idr/index.html"><button class="btn-secondary">Modifica</button></a>
            <a id="deleteBtn_a" href="#"><button class="btn-primary">Elimina</button></a>
        </div>
    </div>
</body>

</html>
