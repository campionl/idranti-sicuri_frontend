<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../body_navbar.css">
    <script src="./script.js"></script>
    <title>Nuova segnalazione</title>

    <!-- CSS e JS di Leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body onload="loadMap();">
    <nav id="navbar">
        <div id="navbar-left"><a href="../index.html">Idranti Sicuri VR</a></div>
    </nav>
    <div id="page_content">
        <h1>Segnalzione di un idrante</h1>
        <hr>
        <div id="tables">
            <table class="ins_table" id="info_table">
                <tr>
                    <td class="keys">Latitudine</td>
                    <td class="vals"><input id="info_id_lat" type="text"></td>
                </tr>
                <tr>
                    <td class="keys">Longitudine</td>
                    <td class="vals"><input id="info_id_lon" type="text"></td>
                </tr>
                <tr>
                    <td class="keys">Immagini</td>
                    <td>
                        <input type="file" id="insert_img" name="immagini" accept=".jpeg,.jpg,.png" multiple
                            onchange="previewImages(event)" placeholder="imgs_input" title="Carica immagini"
                            aria-label="Carica immagini" style="display: none;">
                        <label for="insert_img" id="upload_label"
                            style="display: inline-block; padding: 6px 12px; background-color: #ff0000; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; border-radius: 15px; box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.25);">
                            Carica immagini
                        </label>
                        <div id="preview" style="display: flex; gap: 8px; margin-top: 8px;"></div>
                    </td>
                </tr>
                <tr>
                    <td class="keys">Operativo</td>
                    <td>
                        <form>
                            <input type="radio" name="operativo" id="operative" value="si">
                            <label for="operativo_si">si</label>
                            <input type="radio" name="operativo" id="n_operative" value="no">
                            <label for="operativo_no">no</label>
                            <input type="radio" name="operativo" id="?operative" value="non_pervenuto">
                            <label for="operativo_non_pervenuto">non pervenuto</label>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td class="keys">Campo 1</td>
                    <td class="vals"><input id="camp_1" type="text"></td>
                </tr>
                <tr>
                    <td class="keys">Campo 2</td>
                    <td class="vals"><input id="camp_2" type="text"></td>
                </tr>
                <tr>
                    <td class="keys">Campo 3</td>
                    <td class="vals"><input id="camp_3" type="text"></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button id="conferma" onclick="insert_data()">Conferma</button></td>
                </tr>
            </table>
            <table class="ins_table" id="select_on_map">
                <tr>
                    <td>
                        <div id="mappa"></div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
