<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
    <title>Nuova segnalazione</title>
</head>

<body>
    <nav id="navbar">
        <div id="navbar-left"><a href="../index.html">Idranti Sicuri VR</a></div>
    </nav>
    <div id="page_content">
        <h1>Segnalzione di un idrante</h1>
        <hr>
        <div id = "tables">
            <table class="ins_table" id="info_table">
                <tr>
                    <td class="keys">Latitudine</td>
                    <td class="vals" id="info_id"><input type="text"></td>
                </tr>
                <tr>
                    <td class="keys">Longitudine</td>
                    <td class="vals" id="info_id"><input type="text"></td>
                </tr>
                <tr>
                    <td class="keys">Immagini</td>
                    <td><button>+</button></td>
                    </td>
                </tr>
                <tr>
                    <td class="keys">Operativo</td>
                   <td>
                    <form>
                        <input type="radio" name="operativo" id="operativo_si" value="si">
                        <label for="operativo_si">si</label>
                        <input type="radio" name="operativo" id="operativo_no" value="no">
                        <label for="operativo_no">no</label>
                        <input type="radio" name="operativo" id="operativo_non_pervenuto" value="non_pervenuto">
                        <label for="operativo_non_pervenuto">non pervenuto</label>
                        <button id="x" type="button" onclick="
                            document.querySelectorAll('input[name=operativo]').forEach(r => r.checked = false);
                        ">x</button>
                    </form>
                   </td>
                </tr>
                <tr>
                    <td class="keys">Campo 1</td>
                    <td class="vals" id="info_id"><input type="text"></td>
                </tr>
                <tr>
                    <td class="keys">Campo 2</td>
                    <td class="vals" id="info_id"><input type="text"></td>
                </tr>
                <tr>
                    <td class="keys">Campo 3</td>
                    <td class="vals" id="info_id"><input type="text"></td>
                </tr>
                <tr>
                    <td></td><td><button id = "conferma">Conferma</button></td>
                </tr>
            </table>
            <table class="ins_table" id="select_on_map">
                <tr>
                    <td><div id="mappa"></div></td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
